<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sift</title>
  <meta name="description" content="Tasks, thoughts, things, trades, scans and contracts, all in one place.">
  <meta name="theme-color" content="#0f172a">
  <script>
    // Apply the saved theme before first paint; the setting itself lives in IndexedDB.
    (function () {
      var t = 'blue';
      try { t = localStorage.getItem('sift-theme') || t; } catch (e) {}
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'blue';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sift">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-tasks" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></symbol>
    <symbol id="i-dump" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></symbol>
    <symbol id="i-places" viewBox="0 0 24 24"><path d="M3 7.5l9-4.5 9 4.5v9l-9 4.5-9-4.5z"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9"/></symbol>
    <symbol id="i-scans" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 12h8"/></symbol>
    <symbol id="i-contracts" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></symbol>
    <symbol id="i-trades" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.1L3 17.7 6.3 21l6.3-6.3a4 4 0 0 0 5.1-5.4l-2.5 2.5-2.8-.7-.7-2.8z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></g></symbol>
    <symbol id="i-grip" viewBox="0 0 24 24"><path d="M5 8h14M5 12h14M5 16h14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  </svg>

  <header class="appbar">
    <a href="#/" class="brand"><img src="icons/icon.svg" alt="" width="24" height="24">Sift</a>
    <nav class="topnav" aria-label="Areas">
      <div id="topnav-links"></div>
      <details id="topnav-overflow" hidden>
        <summary id="topnav-more"><svg class="icon" aria-hidden="true"><use href="#i-more"/></svg><span>More</span></summary>
        <div id="topnav-more-menu" class="menu"></div>
      </details>
    </nav>
    <span id="sync-status" class="pill">Local only</span>
    <button type="button" id="quick-add" class="icon-btn" aria-label="Add" hidden><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
  </header>

  <div id="update-banner" class="banner" hidden>
    A new version of Sift is ready. <button type="button">Reload</button>
  </div>

  <main id="main"></main>

  <nav id="tabbar" class="tabbar" aria-label="Areas"></nav>

  <dialog id="more-sheet" class="sheet" aria-label="More areas">
    <div class="sheet-handle"></div>
    <nav id="more-list" class="sheet-list"></nav>
  </dialog>
</body>
</html>
